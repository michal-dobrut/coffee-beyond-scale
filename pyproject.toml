[project]
name = "beanometer"
version = "0.1.0"
description = "Estimate coffee bean mass from a single photo, with quantified uncertainty."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy",
    "opencv-python",
    "scikit-image",
    "matplotlib",
    "pandas",
]

# Tools needed to develop the project but not to use it. `uv sync` installs
# these by default; `pip install beanometer` would not.
[dependency-groups]
dev = [
    "pytest",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/beanometer"]
